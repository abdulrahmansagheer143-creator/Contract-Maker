name: Build AL-MOHAMMADI EST Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "AL-MOHAMMADI-EST-Complete-App.zip"
      - ".github/workflows/build-al-mohammadi-apk.yml"

permissions:
  contents: read

jobs:
  android-preview:
    name: Build installable AL-MOHAMMADI EST APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check and install Android SDK components
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Extract complete app source
        run: |
          test -f AL-MOHAMMADI-EST-Complete-App.zip
          mkdir -p source
          unzip -q AL-MOHAMMADI-EST-Complete-App.zip -d source
          test -f source/android/settings.gradle
          test -f source/android/app/build.gradle
          test -f source/android/app/src/main/assets/web/index.html
          test -f source/android/app/src/main/assets/web/invoice.html
          test -f source/android/app/src/main/java/com/almohammadi/est/MainActivity.java

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: source/android
        run: gradle assembleDebug --no-daemon

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: AL-MOHAMMADI-EST-APK
          path: source/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

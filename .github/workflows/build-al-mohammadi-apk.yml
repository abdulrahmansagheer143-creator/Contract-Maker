name: Build AL-MOHAMMADI EST Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "Contract-Maker-Android-Project-With-Icon.zip"
      - ".github/workflows/build-al-mohammadi-apk.yml"

permissions:
  contents: read

jobs:
  android-preview:
    name: Build installable AL-MOHAMMADI EST APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check Android SDK on runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          command -v sdkmanager
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Extract existing Android project
        run: |
          test -f Contract-Maker-Android-Project-With-Icon.zip
          mkdir -p app-source
          unzip -q Contract-Maker-Android-Project-With-Icon.zip -d app-source
          test -f app-source/Contract-Maker-Android/settings.gradle
          test -f app-source/Contract-Maker-Android/app/build.gradle

      - name: Apply AL-MOHAMMADI EST app branding
        run: |
          sed -i 's/android:label="Contract Maker"/android:label="AL-MOHAMMADI EST"/' app-source/Contract-Maker-Android/app/src/main/AndroidManifest.xml

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: app-source/Contract-Maker-Android
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AL-MOHAMMADI-EST-Android-Preview-APK
          path: app-source/Contract-Maker-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
